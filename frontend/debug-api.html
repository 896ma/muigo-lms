<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Debug</title>
</head>
<body>
    <h1>API Debug Page</h1>
    <div id="results"></div>
    
    <script>
        const API_URL = 'https://muigo-farmers-lms.onrender.com';
        
        async function testAPI() {
            const results = document.getElementById('results');
            
            // Test 1: Health endpoint
            try {
                console.log('Testing health endpoint...');
                const healthResponse = await fetch(`${API_URL}/health`);
                const healthData = await healthResponse.json();
                results.innerHTML += `<p>✅ Health: ${healthResponse.status} - ${JSON.stringify(healthData)}</p>`;
            } catch (error) {
                results.innerHTML += `<p>❌ Health Error: ${error.message}</p>`;
            }
            
            // Test 2: Courses endpoint
            try {
                console.log('Testing courses endpoint...');
                const coursesResponse = await fetch(`${API_URL}/api/courses`);
                const coursesData = await coursesResponse.json();
                results.innerHTML += `<p>✅ Courses: ${coursesResponse.status} - ${coursesData.length} courses found</p>`;
            } catch (error) {
                results.innerHTML += `<p>❌ Courses Error: ${error.message}</p>`;
            }
            
            // Test 3: Login endpoint
            try {
                console.log('Testing login endpoint...');
                const loginResponse = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'test@test.com',
                        password: 'test123'
                    })
                });
                const loginData = await loginResponse.json();
                results.innerHTML += `<p>✅ Login: ${loginResponse.status} - ${JSON.stringify(loginData)}</p>`;
            } catch (error) {
                results.innerHTML += `<p>❌ Login Error: ${error.message}</p>`;
            }
            
            // Test 4: Admin stats endpoint (should fail without auth)
            try {
                console.log('Testing admin stats endpoint...');
                const adminResponse = await fetch(`${API_URL}/api/admin/stats`);
                const adminData = await adminResponse.json();
                results.innerHTML += `<p>✅ Admin Stats: ${adminResponse.status} - ${JSON.stringify(adminData)}</p>`;
            } catch (error) {
                results.innerHTML += `<p>❌ Admin Stats Error: ${error.message}</p>`;
            }
        }
        
        // Run tests when page loads
        testAPI();
    </script>
</body>
</html>
